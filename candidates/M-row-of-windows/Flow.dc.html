<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Old Sites: row of windows</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="../../palette.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{overflow:hidden}
body{margin:0;background:#e7eaee}
a{color:#11151b}a:hover{color:#555}
.mono{font-family:'DM Mono',monospace}
.win{position:absolute;border:0;padding:0;background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 30px 60px #11151b33;transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s,width .55s,height .55s;text-align:left;font:inherit;color:inherit}
.win .bar{height:26px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;background:#dfe3e8;font-family:'DM Mono',monospace;font-size:10px;color:#4a525e;white-space:nowrap;overflow:hidden}
.win .body{flex-grow:1;background:#000;overflow:hidden}
.win.on .body{overflow-y:auto;scrollbar-width:thin}
.win.on{cursor:default}
.nav{width:52px;height:52px;border-radius:50%;border:1px solid #11151b33;background:#fff;font-size:18px;cursor:pointer}
.nav:hover{background:#11151b;color:#fff}
.cap{animation:c .4s ease}
@keyframes c{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.live{animation:lv .35s .5s both}@keyframes lv{from{opacity:0}to{opacity:1}}
.live iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
</style>
</helmet>
<div style="width:{{W}}px;height:{{H}}px;zoom:{{u}};position:relative;overflow:hidden;background:#e7eaee;color:#11151b;font-family:'Hanken Grotesk',sans-serif">
  <div style="position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:3px;padding:4px 5px 4px 12px;border-radius:999px;background:#000000cc;color:#fff;font:500 10px monospace">
    <span style="padding-right:6px;letter-spacing:.05em">TEST · READ MORE OPENS</span>
    <sc-for list="{{spOpts}}" as="o" hint-placeholder-count="6"><button onClick="{{o.pick}}" style="height:26px;min-width:34px;border:0;border-radius:999px;cursor:pointer;font:700 11px monospace;background:{{o.bg}};color:{{o.fg}}">{{o.label}}</button></sc-for>
    <a href="../../index.html" style="height:26px;padding:0 10px;display:flex;align-items:center;margin-left:4px;border-left:1px solid #fff4;color:#fff;font:700 11px monospace;text-decoration:none">ALL</a>
  </div>

  <div style="position:absolute;left:44px;top:28px;right:44px;display:flex;justify-content:space-between;align-items:baseline">
    <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em">Old Sites</div>
    <div class="mono" style="font-size:11px;color:#5b6370">c. 2008 to today, in order</div>
  </div>

  <div style="position:absolute;left:0;right:0;top:70px;height:{{rowH}}px;perspective:1600px">
    <sc-for list="{{wins}}" as="w" hint-placeholder-count="9">
      <button class="win {{w.cls}}" onClick="{{w.pick}}" aria-label="{{w.name}}, {{w.yr}}" style="left:{{w.l}}px;top:{{w.t}}px;width:{{w.w}}px;height:{{w.h}}px;transform:rotateY({{w.rot}}deg) scale({{w.s}});z-index:{{w.z}};opacity:{{w.op}}">
        <span class="bar"><span style="width:7px;height:7px;border-radius:50%;background:{{w.color}};flex:none"></span>{{w.addr}}</span>
        <span class="body"><img src="{{w.img}}" alt="" style="width:100%;display:block"></span>
      </button>
    </sc-for>
    <div class="live" key="{{live.src}}" style="position:absolute;left:{{live.l}}px;top:{{live.t}}px;width:{{live.w}}px;height:{{live.h}}px;overflow:hidden;z-index:400;background:#000"><iframe src="{{live.src}}" title="{{live.title}}" style="width:{{live.fw}}px;height:{{live.fh}}px;transform:scale({{live.fs}})"></iframe></div>
  </div>

  <div class="cap" key="{{cur.key}}" style="position:absolute;left:44px;right:44px;top:{{capTop}}px;display:flex;gap:40px;align-items:flex-start">
    <div style="flex:0 0 250px;display:flex;flex-direction:column;gap:6px">
      <div style="font-size:84px;font-weight:800;line-height:.85;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:{{cur.color}}">{{cur.yr}}</div>
      <div class="mono" style="font-size:11px;color:#5b6370">{{cur.year}} · {{cur.tier}}</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0">
      <div style="font-size:30px;font-weight:800;letter-spacing:-0.02em;line-height:1">{{cur.name}}</div>
      <p style="margin:0;font-size:15px;line-height:1.5;color:#3b424d;max-width:620px">{{cur.blurb}}</p>
    </div>
    <div style="flex:0 0 220px;display:flex;flex-direction:column;gap:8px">
      <a href="{{spHref}}" style="height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#11151b;color:#fff;text-decoration:none;font-weight:800">Read more →</a>
      <a href="{{cur.link}}" target="_blank" style="height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#11151b;color:#fff;text-decoration:none;font-weight:800">Open full screen ↗</a>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="nav" aria-label="Previous site" onClick="{{prev}}">←</button>
        <button class="nav" aria-label="Next site" onClick="{{next}}">→</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
var H = 'https://hackahobo.info';
// splash test: Read more opens the site page chosen in the test bar, for the site on screen.
// splash test: fill the real browser window. The design is drawn for 1280×800; u scales it (CSS zoom) and
// W×H is the canvas, in design pixels, that fills the window. Fixed pages fit both sides, scroll pages fit the width.
function screenFit(fixed){ var w = innerWidth, h = innerHeight, u = fixed ? Math.min(w / 1280, h / 800) : Math.min(w / 1280, 1.25); return { u: u, W: Math.round(w / u), H: Math.round(h / u) }; }
// splash test: big windows show the live site, scaled to fit, like v0.1. DIMS is the width and height each
// site was built for (from v0.1's windows).
var DIMS = {awesome:[1280,900],ask:[1280,800],titans:[1366,768],hobo:[1100,760],hobo26:[1100,760],bv:[1280,900],engen:[1366,768],home:[1280,900],spaceatlas:[1400,850]};
function liveFit(key, w, h){ var d = DIMS[key] || [1280,800], s = w / d[0]; return { fw: d[0], fh: Math.ceil(h / s), fs: s.toFixed(4) }; }
function liveWin(win, key, link, name, bar){ return Object.assign({ src: link, title: name, l: win.l, t: win.t + bar, w: win.w, h: win.h - bar }, liveFit(key, win.w, win.h - bar)); }
var SPD = ['AI','AK','AN','AJ','AL','AM'], SPFROM = '../candidates/M-row-of-windows/Flow.dc.html';
function spPick(){ try { var v = localStorage.getItem('splash-sitepage'); if (SPD.indexOf(v) >= 0) return v; } catch (e) {} return 'AI'; }
function spHref(sp, key){ return '../../sitepages/' + sp + '.html?site=' + (key === 'hobo26' ? 'hobo' : key) + '&from=' + encodeURIComponent(SPFROM); }
function spOpts(cmp, sp){ return SPD.map((k) => ({ label: k, bg: k === sp ? '#ffd23f' : 'transparent', fg: k === sp ? '#111' : '#fff', pick: () => { try { localStorage.setItem('splash-sitepage', k); } catch (e) {} cmp.setState({ sp: k }); } })); }
var SITES = [
 {key:'awesome',name:'Awesome Stuff',yr:'2008',year:'c. 2008',tier:'Flagship',addr:'lawesomel.webs.com',img:'./assets/756e4d2b18729a09e80407e94dcda67b.jpg',link:H+'/projects/sites/lawesomel/index.html',blurb:'I liked talking about tech, so I made a site where I ranked things I liked. Later it held script kiddie hacking tutorials, my photos and the games I made in GameMaker.'},
 {key:'ask',name:'Askthenickman',yr:'2009',year:'c. 2009',tier:'Flagship',addr:'askthenickman.webs.com',img:'./assets/bd8317b58facd85c48c77a2576dd4e30.jpg',link:H+'/projects/sites/askthenickman/index.html',blurb:'I enjoyed the podcast Ask a Ninja and wanted to make my own version. I made the site in Microsoft Word with word art and exported it to HTML. Over time I used it mostly for gaming, and it was the origin of Hack a HOBO.'},
 {key:'titans',name:'Titans Softball',yr:'2010',year:'c. 2010',tier:'Side project',addr:'softball.askthenickman.com',img:'./assets/d40d39122d302efabd22bab1dfba7d0b.jpg',link:H+'/projects/sites/titans/titans.html',blurb:'My dad coached my sister’s softball team and wanted a central hub for the parents. It was the first commissioned site I made.'},
 {key:'hobo',name:'Hack a HOBO',yr:'2011',year:'2011 – today · shown on Nov 6, 2012',tier:'Flagship',addr:'hackahobo.info',img:'./assets/46e9fbc735e6f13e79add42bea6309f1.jpg',link:H+'/files/v1/index-v1.html',blurb:'My sister came up with the name. I started it in middle school, and through high school it was a way for kids to get around blocked gaming sites at school.'},
 {key:'bv',name:'BV Homework',yr:'2013',year:'2013',tier:'Side project',addr:'BVHomework.html',img:'./assets/a5654f5475f2b4df8ec9f935b2936711.jpg',link:H+'/projects/sites/bv-homework/BVHomework.html',blurb:'BV is for Blue Valley. I started it to share answers to homework problems at Blue Valley High School, and stopped working on it for fear of getting in trouble.'},
 {key:'engen',name:'EnGen NextGen',yr:'2014',year:'c. 2014',tier:'Side project',addr:'engennextgen.org',img:'./assets/6547e29fd8f0f8a39623faf8329b0705.jpg',link:H+'/projects/sites/engen/home.php',blurb:'I made this site for an engineering club in exchange for personal training. It won first place at the college’s web design competition.'},
 {key:'home',name:'Home',yr:'2016',year:'2016',tier:'Personal',addr:'localhost/home',img:'./assets/1a78f76048579d3a0a51a2934c39379c.jpg',link:H+'/projects/sites/home-original/index.php',blurb:'My own start page. It greeted me with Welcome Nick and pulled news feeds, Yahoo stock data, weather and reddit.'},
 {key:'spaceatlas',name:'Space Atlas',yr:'2018',year:'2018',tier:'Notable',addr:'thespaceatlas.org',img:'./assets/2bfca578c0f94732e4a6e16ae09412f6.jpg',link:'https://spaceatlas.hackahobo.info/',blurb:'A capstone project in the Air Force Academy’s Astronautical Engineering department about the future of space, looking ahead to 2038. I led web design.'},
 {key:'hobo26',name:'Hack a HOBO',yr:'2026',year:'2026 Edition',tier:'Flagship',addr:'hackahobo.info',img:'./assets/460a63e67a3d643c61ef3f5ef7994aa9.jpg',link:H+'/?theme=original',blurb:'Hack a HOBO went on hiatus after the death of Flash. The 2024 Edition brought the games back through emulators, and the 2026 Edition is an overhaul. It is still running.'}
];
// splash test: site colors come from ../../palette.js: color 1 for the site's color, color 2 for text on it.
SITES.forEach((s) => { s.color = PALETTE.main(s.key); });
var W = {Flagship:720,Notable:600,'Side project':440,Personal:400};
class Component extends DCLogic {
  testVals(){ var sp = this.state.sp || spPick(); return { sp: sp, spOpts: spOpts(this, sp) }; }
  constructor(p){ super(p); addEventListener('resize', () => this.setState({ fit: screenFit(true) })); this.state = { fit: screenFit(true),  i: 0 }; }
  go(k){ this.setState({ i: Math.max(0, Math.min(SITES.length - 1, k)) }); }
  renderVals(){
    var i = this.state.i, cw = W[SITES[i].tier];
    var T = this.testVals();
    var F = this.state.fit;
    var R = {
      u: F.u, W: F.W, H: F.H, rowH: 480 + Math.round((F.H - 800) * 0.7), capTop: 580 + Math.round((F.H - 800) * 0.7),
      spHref: spHref(T.sp, SITES[i].key), spOpts: T.spOpts,
      cur: SITES[i], prev: () => this.go(i - 1), next: () => this.go(i + 1),
      wins: SITES.map((s, k) => {
        var d = k - i, ad = Math.abs(d), sg = d < 0 ? -1 : 1, w = W[s.tier], h = Math.round(w * 0.6);
        var cx = this.state.fit.W / 2, cy = (480 + Math.round((this.state.fit.H - 800) * 0.7)) / 2;
        var x = d === 0 ? cx : cx + sg * (cw / 2 + 90 + (ad - 1) * 150);
        return { name: s.name, yr: s.yr, color: s.color, addr: s.addr, img: s.img, w: w, h: h, l: Math.round(x - w / 2), t: Math.round(cy - h / 2),
          rot: d === 0 ? 0 : -sg * 42, s: d === 0 ? 1 : 0.5, z: 100 - ad, op: ad > 3 ? 0 : (d === 0 ? 1 : 1 - ad * 0.2), cls: d === 0 ? 'on' : '', pick: () => this.go(k) };
      })
    };
    R.live = liveWin(R.wins[i], SITES[i].key, SITES[i].link, SITES[i].name, 26);
    return R;
  }
}
</script>
</body>
</html>
