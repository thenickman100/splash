<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old Sites: fanned windows</title>
<!-- AG, fanned windows, in plain JavaScript (no React). It is R8-AG.dc.html, the design tool's export, rewritten
     by hand: the same layout, sizes and behavior, without the design tool's runtime (support.js) and React. -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../browser.css">
<style>
html,body{overflow:hidden}
body{margin:0;background:#121212}
a{color:#f2f2f2}a:hover{color:#ccc}
.mono{font-family:'DM Mono',monospace}
.stage{color:#f2f2f2;font-family:'Hanken Grotesk',sans-serif}
.c{position:absolute;padding:0;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;font:inherit;transform-origin:center bottom;box-shadow:0 10px 30px #0008;transition:left .6s cubic-bezier(.2,.8,.2,1),top .6s cubic-bezier(.2,.8,.2,1),width .6s cubic-bezier(.2,.8,.2,1),height .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1)}
.c:not(.on):hover{transform:rotate(var(--a)) translateY(-26px)!important}
.c .body{flex-grow:1;overflow:hidden;background:#000}
.c .body img{width:100%;display:block}
.c.on{cursor:default}
.c.on .body{overflow-y:auto;scrollbar-width:thin}
.txt{display:flex;flex-direction:column;animation:t .45s ease}
@keyframes t{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.txt .yr{font-weight:800;line-height:.85;letter-spacing:-0.04em;font-variant-numeric:tabular-nums}
.txt .kick{font-size:11px}
.txt .name{font-weight:800;line-height:1}
.txt p{margin:0;color:#cfcfcf}
.txt .btns{display:flex}
.txt .btns a{flex:1;display:flex;align-items:center;justify-content:center;border-radius:8px;text-decoration:none}
.txt .read{font-weight:800}.txt .open{font-weight:600;border:1px solid}
.livebox{position:absolute;z-index:400;pointer-events:none}
/* The box over the picked card lets clicks through to the card; the live site in it takes them (on phones, after Tap to use). */
.live{position:absolute;left:1px;right:1px;bottom:1px;overflow:hidden;background:#fff;pointer-events:auto;animation:lv .35s .5s both}@keyframes lv{from{opacity:0}to{opacity:1}}
.live iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.use{position:absolute;right:10px;bottom:10px;z-index:2;height:34px;padding:0 14px;border:1px solid #fff8;border-radius:999px;background:#000c;color:#fff;font:600 12px monospace;cursor:pointer;pointer-events:auto}
/* Phones: the page scrolls if it is taller than the screen. */
@media (max-width:759px),(max-height:479px){html,body{overflow:visible}}
/* @edit */
.tb{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:3px;padding:4px 5px 4px 12px;border-radius:999px;background:#000000cc;color:#fff;font:500 10px monospace;white-space:nowrap}
.tb span{padding-right:6px;letter-spacing:.05em}.tb .lbs{display:none}
.tb button{height:26px;min-width:34px;border:0;border-radius:999px;cursor:pointer;font:700 11px monospace;background:transparent;color:#fff}.tb button.on{background:#ffd23f;color:#111}
.tb a{height:26px;padding:0 10px;display:flex;align-items:center;margin-left:4px;border-left:1px solid #fff4;color:#fff;font:700 11px monospace;text-decoration:none}
/* Phones: the test bar sits at the bottom, left of the Palette button. */
@media (max-width:759px),(max-height:479px){.tb{position:fixed;top:auto;bottom:calc(10px + env(safe-area-inset-bottom));left:calc(50% - 26px)}.tb .lbl{display:none}.tb .lbs{display:inline}}
/* @end */
</style>
<script src="../../palette.js"></script>
<script src="../../favicon.js"></script>
<script src="../../browsernav.js"></script>
</head>
<body>
<div id="app"></div>
<script>
(function () {
  var H = 'https://hackahobo.info';
  // Fill the real browser window. The design is drawn for 1280×800; u scales it (CSS zoom) and W×H is the
  // canvas, in design pixels, that fills the window. Phones (under 760px wide, or under 480px tall when held
  // sideways) get their own layout at real size: mob is set and nothing is scaled.
  function screenFit() { var w = innerWidth, h = innerHeight; if (w < 760 || h < 480) return { u: 1, W: w, H: h, mob: true }; var u = Math.min(w / 1280, h / 800); return { u: u, W: Math.round(w / u), H: Math.round(h / u) }; }
  // Big windows show the live site, scaled to fit, like v0.1. DIMS is the width and height each site was built for.
  var DIMS = {awesome:[1280,900],ask:[1280,800],titans:[1366,768],hobo:[1100,760],hobo26:[1100,760],bv:[1280,900],engen:[1366,768],home:[1280,900],spaceatlas:[1400,850]};
  function liveFit(key, w, h) { var d = DIMS[key] || [1280, 800], s = w / d[0]; return { fw: d[0], fh: Math.ceil(h / s), fs: s.toFixed(4) }; }
  // @edit
  // Test bar: which site-page design Read more opens. AG is paired with AN, so it opens AN unless another is picked.
  var SPD = ['AI', 'AK', 'AN'], SPFROM = '../candidates/AG-fanned-windows-main-page/AG.html';
  function spPick() { try { var v = localStorage.getItem('splash-sitepage-AG'); if (SPD.indexOf(v) >= 0) return v; } catch (e) {} return 'AN'; }
  function spHref(key) { return '../../sitepages/' + spPick() + '.html?site=' + (key === 'hobo26' ? 'hobo' : key) + '&from=' + encodeURIComponent(SPFROM); }
  function testBar() {
    var sp = spPick();
    return '<div class="tb"><span class="lbl">TEST · READ MORE OPENS</span><span class="lbs">READ MORE</span>' +
      SPD.map(function (k) { return '<button data-sp="' + k + '"' + (k === sp ? ' class="on"' : '') + '>' + k + '</button>'; }).join('') +
      '<a href="../../index.html">ALL</a></div>';
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('.tb button'); if (!b) return;
    try { localStorage.setItem('splash-sitepage-AG', b.dataset.sp); } catch (x) {}
    document.querySelectorAll('.tb button').forEach(function (x) { x.classList.toggle('on', x === b); });
    shownKey = null; draw();
  });
  // @release
  // // Published: Read more opens the site's own page (SPLASH_PAGES, set by the page).
  // function spHref(key) { return SPLASH_PAGES[key === 'hobo26' ? 'hobo' : key]; }
  // function testBar() { return ''; }
  // @end
  var SITES = [
   {key:'awesome',name:'Awesome Stuff',yr:'2008',year:'c. 2008',tier:'Hobby site',addr:'lawesomel.webs.com',img:'./assets/756e4d2b18729a09e80407e94dcda67b.jpg',link:H+'/projects/sites/lawesomel/index.html',blurb:'I liked talking about tech, so I made a site where I ranked things I liked. Later it held script kiddie hacking tutorials, my photos and the games I made in GameMaker.'},
   {key:'ask',name:'Askthenickman',yr:'2010',year:'c. 2010',tier:'Hobby site',addr:'askthenickman.webs.com',img:'./assets/bd8317b58facd85c48c77a2576dd4e30.jpg',link:H+'/projects/sites/askthenickman/index.html',blurb:'I enjoyed the podcast Ask a Ninja and wanted to make my own version. I made the site in Microsoft Word with word art and exported it to HTML. Over time I used it mostly for gaming, and it was the origin of Hack a HOBO.'},
   {key:'titans',name:'Titans Softball',yr:'2011',year:'c. 2011',tier:'Commission',addr:'softball.askthenickman.com',img:'./assets/d40d39122d302efabd22bab1dfba7d0b.jpg',link:H+'/projects/sites/titans/titans.html',blurb:'My dad coached my sister’s softball team and wanted a central hub for the parents. It was the first commissioned site I made.'},
   {key:'hobo',name:'Hack a HOBO',yr:'2011',year:'2011 – today · shown on Nov 6, 2012',tier:'Hobby site',addr:'hackahobo.info',img:'./assets/46e9fbc735e6f13e79add42bea6309f1.jpg',link:H+'/files/v1/index-v1.html',blurb:'My sister came up with the name. I started it in middle school, and through high school it was a way for kids to get around blocked gaming sites at school.'},
   {key:'bv',name:'BV Homework',yr:'2013',year:'2013',tier:'Unlaunched',addr:'BVHomework.html',img:'./assets/a5654f5475f2b4df8ec9f935b2936711.jpg',link:H+'/projects/sites/bv-homework/BVHomework.html',blurb:'I started it to share answers to homework problems at Blue Valley High School, and stopped working on it for fear of getting in trouble.'},
   {key:'engen',name:'EnGen NextGen',yr:'2014',year:'c. 2014',tier:'Commission',addr:'engennextgen.org',img:'./assets/6547e29fd8f0f8a39623faf8329b0705.jpg',link:H+'/projects/sites/engen/home.php',blurb:'I made this site for an engineering club in exchange for personal training. It won first place at the college’s web design competition.'},
   {key:'home',name:'Home',yr:'2016',year:'2016',tier:'Personal tool',addr:'localhost/home',img:'./assets/1a78f76048579d3a0a51a2934c39379c.jpg',link:H+'/projects/sites/home-original/index.php',blurb:'My own start page. It greeted me with Welcome Nick and pulled news feeds, Yahoo stock data, weather and reddit.'},
   {key:'spaceatlas',name:'Space Atlas',yr:'2018',year:'2018',tier:'Commission',addr:'thespaceatlas.org',img:'./assets/2bfca578c0f94732e4a6e16ae09412f6.jpg',link:'https://spaceatlas.hackahobo.info/',blurb:'A capstone project in the Air Force Academy’s Astronautical Engineering department about the future of space, looking ahead to 2038. I led web design.'},
   {key:'hobo26',name:'Hack a HOBO',yr:'2024',year:'2026 Edition',tier:'Hobby site',addr:'hackahobo.info',img:'./assets/460a63e67a3d643c61ef3f5ef7994aa9.jpg',link:H+'/?theme=original',blurb:'After a long hiatus, Hack a HOBO returned in 2024, now with Flash emulation and design overhauls.'}
  ];
  // Site colors come from ../../palette.js, each part of the page from the palette color chosen for it.
  SITES.forEach(function (s) { s.p = PALETTE.partsFor('AG', s.key); });
  // Fan window widths, by how finished each site is: the most polished largest, the draft smallest.
  var RANK = {hobo26:1, spaceatlas:1, ask:2, awesome:2, hobo:2, titans:3, home:3, engen:4, bv:5};
  var CW = {1:250, 2:220, 3:190, 4:165, 5:140}, CWM = {1:104, 2:92, 3:80, 4:70, 5:60};

  // The site shown: ?site= (or the one showing before a Palette panel reload), otherwise the 2011 Hack a HOBO.
  var start = SITES.map(function (s) { return s.key; }).indexOf(PALETTE.resume);
  var state = { i: start >= 0 ? start : 3, use: null };

  function esc(t) { return String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  // Where everything goes for the site shown, on a desktop-sized window (drawn at 1280×800 and scaled).
  function desk(i, F) {
    var n = SITES.length, sw = 730 + Math.round((F.W - 1280) * 0.6), sh = 440 + Math.round((F.H - 800) * 0.5);
    var cards = SITES.map(function (s, k) {
      if (k === i) return { l: 60, t: 70, w: sw, h: sh, a: 0, z: 300, on: true, fs: 13 };
      var a = -26 + k * (52 / (n - 1)), rad = a * Math.PI / 180, R = 1050, cx = F.W / 2, cy = 1760 + (F.H - 800);
      var w = CW[RANK[s.key]], h = Math.round(w * 0.64), x = cx + R * Math.sin(rad), y = cy - R * Math.cos(rad);
      return { l: Math.round(x - w / 2), t: Math.round(y - h), w: w, h: h, a: a, z: 10 + k, on: false, fs: 7 };
    });
    return { cards: cards, bar: 40, tx: 100 + sw };
  }
  // Phones: the picked window fills the width at the top and the others fan out in a small arc beneath it.
  // Held sideways the window is capped so it fits the screen height.
  function phone(i, F) {
    var n = SITES.length, W = F.W, cw = Math.min(W - 32, Math.round((F.H - 130) / 0.62)), ch = Math.round(cw * 0.62) + 34, fanTop = 12 + ch + 22;
    var A = 22, R = Math.round((W / 2 - 44) / Math.sin(A * Math.PI / 180));
    var cards = SITES.map(function (s, k) {
      if (k === i) return { l: Math.round((W - cw) / 2), t: 12, w: cw, h: ch, a: 0, z: 300, on: true, fs: 11 };
      var a = -A + k * (2 * A / (n - 1)), rad = a * Math.PI / 180, w = CWM[RANK[s.key]], h = Math.round(w * 0.64);
      var x = W / 2 + R * Math.sin(rad), y = fanTop + R * (1 - Math.cos(rad));
      return { l: Math.round(x - w / 2), t: Math.round(y), w: w, h: h, a: a, z: 10 + k, on: false, fs: 5 };
    });
    return { cards: cards, bar: 34, stageH: fanTop + 61 + Math.round(R * (1 - Math.cos(A * Math.PI / 180))) + 18, glowY: fanTop + 40 };
  }

  // The page is built once for each layout (desktop or phone); after that a pick or a resize only moves things,
  // so the windows slide into place.
  var app = document.getElementById('app'), mode = null, stage, fan, txt, cardEls = [], liveBox = null, shownKey = null;
  function build(m) {
    mode = m;
    app.innerHTML = m === 'desk'
      ? '<div class="stage" style="position:relative;overflow:hidden">' + testBar() +
        '<div style="position:absolute;left:60px;top:24px;font-size:24px;font-weight:800">Old Sites</div>' +
        '<div class="txt" style="position:absolute;top:70px;right:50px;height:440px;gap:10px"></div><div class="fan"></div></div>'
      : '<div class="stage" style="box-sizing:border-box;padding-bottom:calc(70px + env(safe-area-inset-bottom))">' + testBar() +
        '<div style="padding:16px 16px 0;font-size:20px;font-weight:800">Old Sites</div>' +
        '<div class="fan" style="position:relative;overflow:hidden"></div><div class="txt" style="padding:0 16px;gap:8px"></div></div>';
    stage = app.querySelector('.stage'); fan = app.querySelector('.fan'); txt = app.querySelector('.txt');
    if (m === 'desk') { fan.style.display = 'contents'; }
    // Every window has its own back and forward buttons in its bar, so they move, grow and turn with it; only the
    // picked window's are wired to its live site. (Windows are divs, since a button can't hold buttons.)
    cardEls = SITES.map(function (s, k) {
      var b = document.createElement('div'); b.className = 'c ob'; b.setAttribute('role', 'button'); b.tabIndex = 0; b.setAttribute('aria-label', s.name + ', ' + s.yr);
      b.innerHTML = '<span class="bar ob-chrome"><button class="bn-back ob-nav" title="Back" aria-disabled="true"></button><button class="bn-fwd ob-nav" title="Forward" aria-disabled="true"></button><i></i><span class="ob-url">' + esc(s.addr) + '</span></span><span class="body"><img src="' + s.img + '" alt=""></span>';
      var pick = function () { if (k !== state.i) { state.i = k; state.use = null; draw(); } };
      // A thumbnail's gray buttons pick it like the rest of it; only the picked window's buttons are back and forward.
      b.addEventListener('click', function (e) { if (!(e.target.closest('.ob-nav') && k === state.i)) pick(); });
      b.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
      fan.appendChild(b); return b;
    });
    liveBox = null; shownKey = null;
  }

  // The story beside (or under) the picked window; it fades in again when the site changes.
  function story(s, mob) {
    var p = s.p;
    return '<div class="yr" style="font-size:' + (mob ? 60 : 88) + 'px;color:' + p.year + '">' + esc(s.yr) + '</div>' +
      '<div class="mono kick" style="color:' + p.kicker + '">' + esc(s.tier) + '</div>' +
      '<div class="name" style="font-size:' + (mob ? 26 : 30) + 'px' + (mob ? ';line-height:1.05' : '') + '">' + esc(s.name) + '</div>' +
      '<p style="font-size:' + (mob ? 15 : 14) + 'px;line-height:' + (mob ? 1.5 : 1.55) + '">' + esc(s.blurb) + '</p>' +
      '<div class="btns" style="gap:' + (mob ? 8 : 10) + 'px;margin-top:' + (mob ? '6px' : 'auto') + '">' +
      '<a class="read" href="' + spHref(s.key) + '" style="height:' + (mob ? 46 : 44) + 'px;background:' + p.readFill + ';color:' + p.readText + '">Read more →</a>' +
      '<a class="open" href="' + s.link + '" target="_blank" style="height:' + (mob ? 46 : 44) + 'px;border-color:' + p.open + ';color:' + p.open + '">Open full screen ↗</a></div>';
  }

  // The live window over the picked card: a fresh one for each site, so back and forward stay with that site.
  // Its back and forward are the card's own buttons; the last card's go back to gray.
  function live(s, c, bar, mob, card) {
    if (!liveBox || liveBox.dataset.key !== s.key) {
      if (liveBox) liveBox.remove();
      cardEls.forEach(function (el) { el.querySelectorAll('.ob-nav').forEach(function (n) { n.classList.remove('bn-on'); n.setAttribute('aria-disabled', 'true'); }); });
      liveBox = document.createElement('div'); liveBox.className = 'livebox'; liveBox.dataset.key = s.key;
      liveBox.innerHTML = '<div class="live" style="top:' + bar + 'px"><iframe src="' + s.link + '" title="' + esc(s.name) + '"></iframe></div>' +
        (mob ? '<button class="use"></button>' : '');
      if (mob) liveBox.querySelector('.use').addEventListener('click', function () { state.use = state.use === s.key ? null : s.key; draw(); });
      // Behind the site, its own page background, so a page shorter than the window doesn't end in white.
      liveBox.querySelector('.live').style.background = liveBox.querySelector('iframe').style.background = PALETTE.pageBg(s.key);
      fan.appendChild(liveBox);
      BrowserNav.attach(liveBox.querySelector('iframe'), card.querySelector('.bn-back'), card.querySelector('.bn-fwd'));
    }
    var st = liveBox.style; st.left = c.l + 'px'; st.top = c.t + 'px'; st.width = c.w + 'px'; st.height = c.h + 'px';
    var f = liveFit(s.key, c.w - 2, c.h - bar - 1), fr = liveBox.querySelector('iframe');
    fr.style.width = f.fw + 'px'; fr.style.height = f.fh + 'px'; fr.style.transform = 'scale(' + f.fs + ')';
    if (mob) {
      var on = state.use === s.key;
      liveBox.querySelector('.live').style.pointerEvents = on ? 'auto' : 'none';
      liveBox.querySelector('.use').textContent = on ? 'Done' : 'Tap to use this site';
    }
  }

  function draw() {
    var F = screenFit(), m = F.mob ? 'mob' : 'desk', i = state.i, s = SITES[i];
    if (m !== mode) build(m);
    PALETTE.showing(s.key);
    siteIcon(s.key);
    var V = F.mob ? phone(i, F) : desk(i, F), glow = 'color-mix(in srgb,' + s.p.glow + ' ' + (F.mob ? 40 : 45) + '%,#121212)';
    if (F.mob) {
      stage.style.minHeight = F.H + 'px';
      stage.style.background = 'radial-gradient(ellipse 120% 50% at 50% ' + V.glowY + 'px,' + glow + ',#121212 70%)';
      fan.style.height = V.stageH + 'px';
    } else {
      stage.style.width = F.W + 'px'; stage.style.height = F.H + 'px'; stage.style.zoom = F.u;
      stage.style.background = 'radial-gradient(ellipse at 50% 120%,' + glow + ',#121212 60%)';
      txt.style.left = V.tx + 'px';
    }
    V.cards.forEach(function (c, k) {
      var el = cardEls[k], st = el.style;
      st.left = c.l + 'px'; st.top = c.t + 'px'; st.width = c.w + 'px'; st.height = c.h + 'px';
      st.transform = 'rotate(' + c.a.toFixed(1) + 'deg)'; st.setProperty('--a', c.a.toFixed(1) + 'deg'); st.zIndex = c.z;
      el.classList.toggle('on', c.on); el.querySelector('.bar').style.fontSize = c.fs + 'px';
    });
    if (shownKey !== s.key) {
      shownKey = s.key; txt.innerHTML = story(s, F.mob);
      txt.style.animation = 'none'; void txt.offsetWidth; txt.style.animation = '';
    }
    live(s, V.cards[i], V.bar, F.mob, cardEls[i]);
  }

  addEventListener('resize', draw);
  draw();
})();
</script>
</body>
</html>
