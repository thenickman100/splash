<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Old Sites: scroll through time</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="../../palette.js"></script>
<script src="../../browsernav.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
html,body{overflow:hidden}
body{margin:0;background:#0f1012}
a{color:#fff}a:hover{color:#ccc}
.mono{font-family:'IBM Plex Mono',monospace}
.sc{scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.shot{transition:background-position .15s linear}
.hint{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(6px)}}
.chrome{transition:background .5s,border-radius .5s}
.live{animation:lv .35s .5s both}@keyframes lv{from{opacity:0}to{opacity:1}}
.live iframe{position:absolute;left:0;top:0;border:0;transform-origin:0 0;background:#fff}
.bn-back,.bn-fwd{width:16px;height:16px;padding:0;border:0;border-radius:50%;background:transparent;color:inherit;font:700 14px/15px system-ui,sans-serif;opacity:.3;cursor:default}
.bn-back.bn-on,.bn-fwd.bn-on{opacity:1;cursor:pointer}.bn-back.bn-on:hover,.bn-fwd.bn-on:hover{background:#8884}
</style>
</helmet>
<div class="sc" onScroll="{{onScroll}}" style="width:{{W}}px;height:{{H}}px;zoom:{{u}};overflow-y:auto;background:#0f1012;color:#f1f1ef;font-family:'Bricolage Grotesque',sans-serif">
  <div style="position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:3px;padding:4px 5px 4px 12px;border-radius:999px;background:#000000cc;color:#fff;font:500 10px monospace">
    <span style="padding-right:6px;letter-spacing:.05em">TEST · READ MORE OPENS</span>
    <sc-for list="{{spOpts}}" as="o" hint-placeholder-count="6"><button onClick="{{o.pick}}" style="height:26px;min-width:34px;border:0;border-radius:999px;cursor:pointer;font:700 11px monospace;background:{{o.bg}};color:{{o.fg}}">{{o.label}}</button></sc-for>
    <a href="../../index.html" style="height:26px;padding:0 10px;display:flex;align-items:center;margin-left:4px;border-left:1px solid #fff4;color:#fff;font:700 11px monospace;text-decoration:none">ALL</a>
  </div>

  <div style="height:{{total}}px;position:relative">
    <div style="position:sticky;top:0;height:{{H}}px;display:flex;box-sizing:border-box;padding:36px 48px;gap:48px">

      <div style="flex:0 0 330px;display:flex;flex-direction:column;gap:14px">
        <div style="font-size:22px;font-weight:800">Old Sites</div>
        <div style="margin-top:50px;font-size:150px;font-weight:800;line-height:.82;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:{{cur.color}};transition:color .4s">{{cur.yr}}</div>
        <div class="mono" style="font-size:12px;color:#9a9b9f">{{cur.year}} · {{cur.tier}}</div>
        <div style="font-size:{{cur.fs}}px;font-weight:800;line-height:1;letter-spacing:-0.02em">{{cur.name}}</div>
        <p style="margin:0;font-size:15px;line-height:1.55;color:#c8c9cc">{{cur.blurb}}</p>
        <div style="margin-top:auto;display:flex;gap:10px">
          <a href="{{cur.link}}" target="_blank" style="flex:1;height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:{{cur.color}};color:{{cur.on}};text-decoration:none;font-weight:800">Open full screen ↗</a>
          <a href="{{spHref}}" style="flex:1;height:46px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid #3a3b40;text-decoration:none;font-weight:500">Read more →</a>
        </div>
      </div>

      <div class="chrome" data-bn style="flex-grow:1;display:flex;flex-direction:column;border-radius:{{ch.r}}px;overflow:hidden;background:{{ch.bar}};box-shadow:0 30px 80px #000a">
        <div style="height:42px;display:flex;align-items:center;gap:10px;padding:0 14px">
          <span style="display:flex;gap:4px;align-items:center;color:{{ch.text}}"><button class="bn-back" title="Back" disabled>‹</button><button class="bn-fwd" title="Forward" disabled>›</button><span style="width:11px;height:11px;border-radius:50%;background:{{ch.dot}}"></span></span>
          <div class="mono" style="flex-grow:1;height:26px;display:flex;align-items:center;padding:0 12px;border-radius:{{ch.ur}}px;background:{{ch.url}};color:{{ch.text}};font-size:12px">http://{{cur.addr}}</div>
        </div>
        <div class="shot" style="flex-grow:1;position:relative;overflow:hidden;background:#000"><div class="live" key="{{cur.link}}" style="position:absolute;inset:0;pointer-events:{{lf.pe}}"><iframe src="{{cur.link}}" title="{{cur.name}}" style="width:{{lf.fw}}px;height:{{lf.fh}}px;transform:scale({{lf.fs}})"></iframe></div><sc-if value="{{lf.cover}}" hint-placeholder-val="{{true}}"><button onClick="{{lf.use}}" class="mono" style="position:absolute;right:14px;bottom:14px;height:34px;padding:0 14px;border:0;border-radius:999px;background:#000c;color:#fff;font-size:12px;cursor:pointer">Click to use this site</button></sc-if></div>
      </div>

      <div style="flex:0 0 14px;position:relative;margin:20px 0">
        <div style="position:absolute;left:6px;top:0;bottom:0;width:2px;background:#2a2b30"></div>
        <sc-for list="{{marks}}" as="m" hint-placeholder-count="9">
          <div style="position:absolute;left:{{m.l}}px;top:{{m.top}}%;width:{{m.w}}px;height:{{m.h}}%;background:{{m.color}};opacity:{{m.op}};border-radius:2px"></div>
        </sc-for>
        <div style="position:absolute;left:-3px;top:{{pct}}%;width:20px;height:2px;background:#fff"></div>
      </div>
    </div>
    <sc-if value="{{atStart}}" hint-placeholder-val="{{true}}">
      <div class="mono hint" style="position:absolute;left:48px;top:{{hintTop}}px;font-size:12px;color:#9a9b9f">Scroll to travel through the years ↓</div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
var H = 'https://hackahobo.info';
// splash test: Read more opens the site page chosen in the test bar, for the site on screen.
// splash test: fill the real browser window. The design is drawn for 1280×800; u scales it (CSS zoom) and
// W×H is the canvas, in design pixels, that fills the window. Fixed pages fit both sides, scroll pages fit the width.
function screenFit(fixed){ var w = innerWidth, h = innerHeight, u = fixed ? Math.min(w / 1280, h / 800) : Math.min(w / 1280, 1.25); return { u: u, W: Math.round(w / u), H: Math.round(h / u) }; }
// splash test: big windows show the live site, scaled to fit, like v0.1. DIMS is the width and height each
// site was built for (from v0.1's windows).
var DIMS = {awesome:[1280,900],ask:[1280,800],titans:[1366,768],hobo:[1100,760],hobo26:[1100,760],bv:[1280,900],engen:[1366,768],home:[1280,900],spaceatlas:[1400,850]};
function liveFit(key, w, h){ var d = DIMS[key] || [1280,800], s = w / d[0]; return { fw: d[0], fh: Math.ceil(h / s), fs: s.toFixed(4) }; }
function liveWin(win, key, link, name, bar){ return Object.assign({ src: link, title: name, l: win.l, t: win.t + bar, w: win.w, h: win.h - bar }, liveFit(key, win.w, win.h - bar)); }
var SPD = ['AI','AK','AN','AJ','AL','AM'], SPFROM = '../candidates/K-scroll-through-time/Travel.dc.html';
function spPick(){ try { var v = localStorage.getItem('splash-sitepage'); if (SPD.indexOf(v) >= 0) return v; } catch (e) {} return 'AI'; }
function spHref(sp, key){ return '../../sitepages/' + sp + '.html?site=' + (key === 'hobo26' ? 'hobo' : key) + '&from=' + encodeURIComponent(SPFROM); }
function spOpts(cmp, sp){ return SPD.map((k) => ({ label: k, bg: k === sp ? '#ffd23f' : 'transparent', fg: k === sp ? '#111' : '#fff', pick: () => { try { localStorage.setItem('splash-sitepage', k); } catch (e) {} cmp.setState({ sp: k }); } })); }
var KEYS = {'Awesome Stuff':'awesome','Askthenickman':'ask','Titans Softball':'titans','Hack a HOBO':'hobo','BV Homework':'bv','EnGen NextGen':'engen','Home':'home','Space Atlas':'spaceatlas'};
var SITES = [
 {name:'Awesome Stuff',yr:'2008',year:'c. 2008',tier:'Flagship',w:3,era:0,addr:'lawesomel.webs.com',img:'./assets/756e4d2b18729a09e80407e94dcda67b.jpg',link:H+'/projects/sites/lawesomel/index.html',blurb:'I liked talking about tech, so I made a site where I ranked things I liked. Later it held script kiddie hacking tutorials, my photos and the games I made in GameMaker.'},
 {name:'Askthenickman',yr:'2009',year:'c. 2009',tier:'Flagship',w:3,era:0,addr:'askthenickman.webs.com',img:'./assets/bd8317b58facd85c48c77a2576dd4e30.jpg',link:H+'/projects/sites/askthenickman/index.html',blurb:'I enjoyed the podcast Ask a Ninja and wanted to make my own version. I made the site in Microsoft Word with word art and exported it to HTML. Over time I used it mostly for gaming, and it was the origin of Hack a HOBO.'},
 {name:'Titans Softball',yr:'2010',year:'c. 2010',tier:'Side project',w:1,era:0,addr:'softball.askthenickman.com',img:'./assets/d40d39122d302efabd22bab1dfba7d0b.jpg',link:H+'/projects/sites/titans/titans.html',blurb:'My dad coached my sister’s softball team and wanted a central hub for the parents. It was the first commissioned site I made.'},
 {name:'Hack a HOBO',yr:'2011',year:'2011 – today',tier:'Flagship',w:3.5,era:1,addr:'hackahobo.info',img:'./assets/46e9fbc735e6f13e79add42bea6309f1.jpg',link:H+'/files/v1/index-v1.html',blurb:'My sister came up with the name. I started it in middle school, and through high school it was a way for kids to get around blocked gaming sites at school. Shown here on November 6, 2012, its golden age.'},
 {name:'BV Homework',yr:'2013',year:'2013',tier:'Side project',w:.8,era:1,addr:'BVHomework.html',img:'./assets/a5654f5475f2b4df8ec9f935b2936711.jpg',link:H+'/projects/sites/bv-homework/BVHomework.html',blurb:'BV is for Blue Valley. I started it to share answers to homework problems at Blue Valley High School, and stopped working on it for fear of getting in trouble.'},
 {name:'EnGen NextGen',yr:'2014',year:'c. 2014',tier:'Side project',w:1,era:1,addr:'engennextgen.org',img:'./assets/6547e29fd8f0f8a39623faf8329b0705.jpg',link:H+'/projects/sites/engen/home.php',blurb:'I made this site for an engineering club in exchange for personal training. It won first place at the college’s web design competition.'},
 {name:'Home',yr:'2016',year:'2016',tier:'Personal',w:.8,era:2,addr:'localhost/home',img:'./assets/1a78f76048579d3a0a51a2934c39379c.jpg',link:H+'/projects/sites/home-original/index.php',blurb:'My own start page. It greeted me with Welcome Nick and pulled news feeds, Yahoo stock data, weather and reddit.'},
 {name:'Space Atlas',yr:'2018',year:'2018',tier:'Notable',w:2,era:2,addr:'thespaceatlas.org',img:'./assets/2bfca578c0f94732e4a6e16ae09412f6.jpg',link:'https://spaceatlas.hackahobo.info/',blurb:'A capstone project in the Air Force Academy’s Astronautical Engineering department about the future of space, looking ahead to 2038. I led web design.'},
 {name:'Hack a HOBO',yr:'2026',year:'2026 Edition',tier:'Flagship',w:3,era:2,addr:'hackahobo.info',img:'./assets/460a63e67a3d643c61ef3f5ef7994aa9.jpg',link:H+'/?theme=original',blurb:'Hack a HOBO went on hiatus after the death of Flash. The 2024 Edition brought the games back through emulators, and the 2026 Edition is an overhaul with a new left sidebar and game containers that can take holiday themes. It is still running.'}
];
// splash test: site colors come from ../../palette.js: color 1 for the site's color, color 2 for text on it.
SITES.forEach((s) => { s.color = PALETTE.main(KEYS[s.name]); s.on = PALETTE.on(KEYS[s.name]); });
var ERA = [
 {bar:'#c9ced6',dot:'#9aa1ac',url:'#fff',text:'#222',r:4,ur:2},
 {bar:'#e4e6ea',dot:'#c3c7ce',url:'#fff',text:'#222',r:8,ur:13},
 {bar:'#25262b',dot:'#45464d',url:'#18191c',text:'#ddd',r:16,ur:13}
];
var TOT = SITES.reduce((a, s) => a + s.w, 0), PX = 900, TOTAL = Math.round(TOT * PX / 3 + 800);
class Component extends DCLogic {
  testVals(){ var sp = this.state.sp || spPick(); return { sp: sp, spOpts: spOpts(this, sp) }; }
  constructor(p){ super(p); addEventListener('resize', () => this.setState({ fit: screenFit(true) })); this.state = { fit: screenFit(true),  p: 0 }; }
  renderVals(){
    var p = this.state.p, pos = p * TOT, acc = 0, i = 0;
    for (; i < SITES.length - 1; i++) { if (pos < acc + SITES[i].w) break; acc += SITES[i].w; }
    var s = SITES[i], local = Math.max(0, Math.min(100, (pos - acc) / s.w * 100)), a2 = 0;
    var T = this.testVals();
    var F = this.state.fit;
    var on = this.state.use === s.name;
    return {
      lf: Object.assign(liveFit(KEYS[s.name], F.W - 536, F.H - 114), { pe: on ? 'auto' : 'none', cover: !on, use: () => this.setState({ use: s.name }) }),
      u: F.u, W: F.W, H: F.H, hintTop: F.H - 112,
      spHref: spHref(T.sp, KEYS[s.name]), spOpts: T.spOpts,
      total: TOTAL, cur: Object.assign({}, s, { fs: s.tier === 'Flagship' ? 44 : (s.tier === 'Notable' ? 34 : 26) }), ch: ERA[s.era],
      local: Math.round(local), pct: (p * 100).toFixed(1), atStart: p < 0.02,
      marks: SITES.map((x, k) => { var t = a2 / TOT * 100; a2 += x.w; var big = x.tier === 'Flagship'; return { top: t, h: x.w / TOT * 100 - 0.6, w: big ? 14 : (x.tier === 'Notable' ? 10 : 6), l: big ? 0 : (x.tier === 'Notable' ? 2 : 4), color: x.color, op: k === i ? 1 : 0.35 }; }),
      onScroll: (e) => { var el = e.target; var max = el.scrollHeight - el.clientHeight; this.setState({ p: max > 0 ? el.scrollTop / max : 0 }); }
    };
  }
}
</script>
</body>
</html>
