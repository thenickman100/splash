<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Old Sites: row of windows</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;800&amp;family=DM+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e7eaee}
a{color:#11151b}a:hover{color:#555}
.mono{font-family:'DM Mono',monospace}
.win{position:absolute;border:0;padding:0;background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;box-shadow:0 30px 60px #11151b33;transition:left .55s cubic-bezier(.2,.8,.2,1),top .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s,width .55s,height .55s;text-align:left;font:inherit;color:inherit}
.win .bar{height:26px;flex:none;display:flex;align-items:center;gap:6px;padding:0 10px;background:#dfe3e8;font-family:'DM Mono',monospace;font-size:10px;color:#4a525e;white-space:nowrap;overflow:hidden}
.win .body{flex-grow:1;background:#000;overflow:hidden}
.win.on .body{overflow-y:auto;scrollbar-width:thin}
.win.on{cursor:default}
.nav{width:52px;height:52px;border-radius:50%;border:1px solid #11151b33;background:#fff;font-size:18px;cursor:pointer}
.nav:hover{background:#11151b;color:#fff}
.cap{animation:c .4s ease}
@keyframes c{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width:1280px;height:800px;position:relative;overflow:hidden;background:#e7eaee;color:#11151b;font-family:'Hanken Grotesk',sans-serif">
  <div style="position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:999;display:flex;align-items:center;gap:3px;padding:4px 5px 4px 12px;border-radius:999px;background:#000000cc;color:#fff;font:500 10px monospace">
    <span style="padding-right:6px;letter-spacing:.05em">TEST · READ MORE OPENS</span>
    <sc-for list="{{spOpts}}" as="o" hint-placeholder-count="6"><button onClick="{{o.pick}}" style="height:26px;min-width:34px;border:0;border-radius:999px;cursor:pointer;font:700 11px monospace;background:{{o.bg}};color:{{o.fg}}">{{o.label}}</button></sc-for>
  </div>
  <div style="position:absolute;left:44px;top:28px;right:44px;display:flex;justify-content:space-between;align-items:baseline">
    <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em">Old Sites</div>
    <div class="mono" style="font-size:11px;color:#5b6370">c. 2008 to today, in order</div>
  </div>

  <div style="position:absolute;left:0;right:0;top:70px;height:480px;perspective:1600px">
    <sc-for list="{{wins}}" as="w" hint-placeholder-count="9">
      <button class="win {{w.cls}}" onClick="{{w.pick}}" aria-label="{{w.name}}, {{w.yr}}" style="left:{{w.l}}px;top:{{w.t}}px;width:{{w.w}}px;height:{{w.h}}px;transform:rotateY({{w.rot}}deg) scale({{w.s}});z-index:{{w.z}};opacity:{{w.op}}">
        <span class="bar"><span style="width:7px;height:7px;border-radius:50%;background:{{w.color}};flex:none"></span>{{w.addr}}</span>
        <span class="body"><img src="{{w.img}}" alt="" style="width:100%;display:block"></span>
      </button>
    </sc-for>
  </div>

  <div class="cap" key="{{cur.key}}" style="position:absolute;left:44px;right:44px;top:580px;display:flex;gap:40px;align-items:flex-start">
    <div style="flex:0 0 250px;display:flex;flex-direction:column;gap:6px">
      <div style="font-size:84px;font-weight:800;line-height:.85;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:{{cur.color}}">{{cur.yr}}</div>
      <div class="mono" style="font-size:11px;color:#5b6370">{{cur.year}} · {{cur.tier}}</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0">
      <div style="font-size:30px;font-weight:800;letter-spacing:-0.02em;line-height:1">{{cur.name}}</div>
      <p style="margin:0;font-size:15px;line-height:1.5;color:#3b424d;max-width:620px">{{cur.blurb}}</p>
    </div>
    <div style="flex:0 0 220px;display:flex;flex-direction:column;gap:8px">
      <a href="{{spHref}}" style="height:44px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#11151b;color:#fff;text-decoration:none;font-weight:800">Read more →</a>
      <a href="{{cur.link}}" target="_blank" style="height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid #11151b;color:#11151b;text-decoration:none;font-weight:600">Open full screen ↗</a>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="nav" aria-label="Previous site" onClick="{{prev}}">←</button>
        <button class="nav" aria-label="Next site" onClick="{{next}}">→</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
var H = 'https://hackahobo.info';
var SITES = [
 {key:'awesome',name:'Awesome Stuff',yr:'2008',year:'c. 2008',tier:'Flagship',color:'#5f8f14',addr:'lawesomel.webs.com',img:'./assets/756e4d2b18729a09e80407e94dcda67b.jpg',link:H+'/projects/sites/lawesomel/index.html',blurb:'I liked talking about tech, so I made a site where I ranked things I liked. Later it held script kiddie hacking tutorials, my photos and the games I made in GameMaker.'},
 {key:'ask',name:'Askthenickman',yr:'2009',year:'c. 2009',tier:'Flagship',color:'#c4291b',addr:'askthenickman.webs.com',img:'./assets/bd8317b58facd85c48c77a2576dd4e30.jpg',link:H+'/projects/sites/askthenickman/index.html',blurb:'I enjoyed the podcast Ask a Ninja and wanted to make my own version. I made the site in Microsoft Word with word art and exported it to HTML. Over time I used it mostly for gaming, and it was the origin of Hack a HOBO.'},
 {key:'titans',name:'Titans Softball',yr:'2010',year:'c. 2010',tier:'Side project',color:'#a57800',addr:'softball.askthenickman.com',img:'./assets/d40d39122d302efabd22bab1dfba7d0b.jpg',link:H+'/projects/sites/titans/titans.html',blurb:'My dad coached my sister’s softball team and wanted a central hub for the parents. It was the first commissioned site I made.'},
 {key:'hobo',name:'Hack a HOBO',yr:'2011',year:'2011 – today · shown on Nov 6, 2012',tier:'Flagship',color:'#16803a',addr:'hackahobo.info',img:'./assets/46e9fbc735e6f13e79add42bea6309f1.jpg',link:H+'/files/v1/index-v1.html',blurb:'My sister came up with the name. I started it in middle school, and through high school it was a way for kids to get around blocked gaming sites at school.'},
 {key:'bv',name:'BV Homework',yr:'2013',year:'2013',tier:'Side project',color:'#b02525',addr:'BVHomework.html',img:'./assets/a5654f5475f2b4df8ec9f935b2936711.jpg',link:H+'/projects/sites/bv-homework/BVHomework.html',blurb:'BV is for Blue Valley. I started it to share answers to homework problems at Blue Valley High School, and stopped working on it for fear of getting in trouble.'},
 {key:'engen',name:'EnGen NextGen',yr:'2014',year:'c. 2014',tier:'Side project',color:'#2457d6',addr:'engennextgen.org',img:'./assets/6547e29fd8f0f8a39623faf8329b0705.jpg',link:H+'/projects/sites/engen/home.php',blurb:'I made this site for an engineering club in exchange for personal training. It won first place at the college’s web design competition.'},
 {key:'home',name:'Home',yr:'2016',year:'2016',tier:'Personal',color:'#1f7f99',addr:'localhost/home',img:'./assets/1a78f76048579d3a0a51a2934c39379c.jpg',link:H+'/projects/sites/home-original/index.php',blurb:'My own start page. It greeted me with Welcome Nick and pulled news feeds, Yahoo stock data, weather and reddit.'},
 {key:'spaceatlas',name:'Space Atlas',yr:'2018',year:'2018',tier:'Notable',color:'#3c4cc2',addr:'thespaceatlas.org',img:'./assets/2bfca578c0f94732e4a6e16ae09412f6.jpg',link:'https://spaceatlas.hackahobo.info/',blurb:'A capstone project in the Air Force Academy’s Astronautical Engineering department about the future of space, looking ahead to 2038. I led web design.'},
 {key:'hobo26',name:'Hack a HOBO',yr:'2026',year:'2026 Edition',tier:'Flagship',color:'#16803a',addr:'hackahobo.info',img:'./assets/460a63e67a3d643c61ef3f5ef7994aa9.jpg',link:H+'/?theme=original',blurb:'Hack a HOBO went on hiatus after the death of Flash. The 2024 Edition brought the games back through emulators, and the 2026 Edition is an overhaul. It is still running.'}
];
var W = {Flagship:720,Notable:600,'Side project':440,Personal:400};
var SP = {AI:'R8-AI.dc.html',AJ:'AJ-Drawer.dc.html',AK:'AK-Chapters.dc.html',AL:'AL-Longread.dc.html',AM:'AM-WindowPage.dc.html',AN:'AN-FanPage.dc.html'};
class Component extends DCLogic {
  testVals(){ var sp = this.state.sp || 'AI'; return { spHref: SP[sp], spOpts: Object.keys(SP).map((k) => ({ label: k, bg: k === sp ? '#ffd23f' : 'transparent', fg: k === sp ? '#111' : '#fff', pick: () => this.setState({ sp: k }) })) }; }
  constructor(p){ super(p); this.state = { i: 0 }; }
  go(k){ this.setState({ i: Math.max(0, Math.min(SITES.length - 1, k)) }); }
  renderVals(){
    var i = this.state.i, cw = W[SITES[i].tier];
    var T = this.testVals();
    return {
      spHref: T.spHref, spOpts: T.spOpts,
      cur: SITES[i], prev: () => this.go(i - 1), next: () => this.go(i + 1),
      wins: SITES.map((s, k) => {
        var d = k - i, ad = Math.abs(d), sg = d < 0 ? -1 : 1, w = W[s.tier], h = Math.round(w * 0.6);
        var x = d === 0 ? 640 : 640 + sg * (cw / 2 + 90 + (ad - 1) * 150);
        return { name: s.name, yr: s.yr, color: s.color, addr: s.addr, img: s.img, w: w, h: h, l: Math.round(x - w / 2), t: Math.round(240 - h / 2),
          rot: d === 0 ? 0 : -sg * 42, s: d === 0 ? 1 : 0.5, z: 100 - ad, op: ad > 3 ? 0 : (d === 0 ? 1 : 1 - ad * 0.2), cls: d === 0 ? 'on' : '', pick: () => this.go(k) };
      })
    };
  }
}
</script>
</body>
</html>
