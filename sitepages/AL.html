<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old Sites</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* AL · Long read. Values from the AL export (AL-Longread.dc.html). */
:root{--surface:#f2f3f1;--bg:#f2f3f1;--ink:#16181a;--muted:#5d6268;--line:#16181a1a;--accent:#16803a}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',sans-serif}
a{color:var(--ink)}a:hover{color:var(--accent-ink)}
.mono{font-family:'DM Mono',monospace}
.top{height:64px;display:flex;align-items:center;gap:24px;padding:0 50px;border-bottom:1px solid var(--line)}
.top a{text-decoration:none}.top .home{font-weight:800}.top .sp{flex-grow:1}.top .mono{font-size:12px}
.hero{padding:70px 50px 40px;display:flex;flex-direction:column;gap:18px}
.kick{font-size:13px;color:var(--accent-ink)}
h1{margin:0;font-size:clamp(56px,11vw,150px);font-weight:800;letter-spacing:-0.055em;line-height:.82}
.facts{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 26px;padding-top:8px}
.facts span{white-space:nowrap}
.col{padding:10px 50px 0;max-width:720px;box-sizing:content-box}
.col p{margin:0 0 22px;font-family:'Source Serif 4',serif;font-size:19px;line-height:1.7;color:#2a2d31}
.lede p{font-size:25px;line-height:1.55}
.col h2{margin:48px 0 18px;font-size:30px;font-weight:800;letter-spacing:-0.02em}
.col h3{margin:30px 0 10px;font-size:20px;font-weight:800}
.wide{padding:20px 50px 30px}
.sp-win{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;background:#1b1e24;box-shadow:0 24px 60px #16181a33}
.sp-chrome{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 14px;color:#c9ced8;font:12px 'DM Mono',monospace}
.sp-chrome i{width:9px;height:9px;border-radius:50%;background:#46e06a}.sp-chrome i+i{background:#ffbf3c}.sp-chrome i+i+i{background:#ff5f57}
.sp-chrome .sp-url{margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sp-btns{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding:14px 0 6px}
.sp-btn{font:800 15px 'Bricolage Grotesque',sans-serif;text-decoration:none;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.sp-btn:hover{color:var(--accent-ink)}
button.sp-btn{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ink);font:12px 'DM Mono',monospace}
.sp-fig{margin:28px 0}.sp-fig img{max-width:100%;border-radius:10px;display:block}
.sp-fig.dark img{background:#16181a;padding:20px;box-sizing:border-box}
.sp-fig figcaption{margin-top:8px;font:12px 'DM Mono',monospace;color:var(--muted)}
.sp-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:10px 0 20px}
.sp-gallery .sp-fig{margin:0}.sp-gallery img{width:100%;aspect-ratio:4/3;object-fit:cover}
.sp-icons{grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}.sp-icons img{aspect-ratio:1;object-fit:contain}
.sp-list{columns:3 180px;padding:0;margin:0 0 10px;list-style:none;font:14px/1.9 'DM Mono',monospace}
.sp-list a{text-decoration:none;border-bottom:1px solid var(--line)}.sp-list span{color:var(--muted)}
.sp-code{white-space:pre-wrap;word-break:break-all;background:#16181a;color:#e8eae6;padding:16px;border-radius:10px;font:12px/1.6 'DM Mono',monospace}
.sp-logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:10px 0 20px}
.sp-logo{background:#fff;border:2px solid transparent;border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;font:10px 'DM Mono',monospace;color:var(--muted)}
.sp-logo img{width:100%;height:70px;object-fit:contain}.sp-logo.on{border-color:var(--accent-mark)}
.seg{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--ink);background:transparent;font:12px 'DM Mono',monospace;cursor:pointer;color:var(--ink)}.seg.on{background:var(--ink);color:#fff}
.next{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:60px}
.next a{padding:34px 50px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.next a+a,.next span+a{border-left:1px solid var(--line);align-items:flex-end;text-align:right}
.next .mono{font-size:11px;color:var(--muted)}.next b{font-size:32px;font-weight:800;letter-spacing:-0.02em}
@media (max-width:700px){
  .top,.hero,.col,.wide{padding-left:16px;padding-right:16px}.top{gap:14px}.top .mono{display:none}
  .hero{padding-top:56px}.lede p{font-size:21px}.col p{font-size:17px}
  .next a{padding:24px 16px}.next b{font-size:22px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="../palette.js"></script>
<script src="data.js"></script>
<script src="../browsernav.js"></script>
<script src="common.js"></script>
<script>
SP.boot(function (s, sp) {
  var e = sp.esc, h = '';
  h += '<div class="top"><a class="home" href="' + sp.home + '">← All sites</a><span class="sp"></span>' +
    (sp.prev ? '<a class="mono" href="' + sp.url(sp.prev.key) + '">← ' + e(sp.prev.name) + '</a>' : '') +
    (sp.next ? '<a class="mono" href="' + sp.url(sp.next.key) + '">' + e(sp.next.name) + ' →</a>' : '') + '</div>';
  h += '<div class="hero"><div class="mono kick">' + e(s.range) + ' · ' + e(s.tier) + '</div><h1>' + e(s.name) + '</h1>' +
    '<div class="mono facts">' + sp.facts(s).map(function (r) {
      return Array.isArray(r[1]) ? r[1].map(function (a) { return '<span>' + e(a) + '</span>'; }).join('') : '<span>' + e(r[0]) + ' ' + e(r[1]) + '</span>';
    }).join('') + '</div></div>';
  h += '<div class="col lede"><p>' + e(s.lede) + '</p></div>';
  // Opening window, live, with a switch between the site's versions, from the AL export.
  var vers = s.sections.filter(function (x) { return x.embed; }).map(function (x) { return x.embed; });
  if (vers.length) {
    h += '<div class="wide">' + sp.embedHtml(Object.assign({}, vers[0], { id: 'hero' })) +
      '<div class="sp-btns">' + (vers.length > 1 ? vers.map(function (v, k) { return '<button class="seg' + (k ? '' : ' on') + '" data-v="' + k + '">' + e(v.title) + '</button>'; }).join('') : '') +
      '<span style="flex-grow:1"></span><a class="sp-btn hero-open" href="' + vers[0].src + '" target="_blank" rel="noopener">Open full screen ↗</a></div></div>';
  }
  s.sections.forEach(function (sec) {
    // Text stays in the reading column; windows break out to full width, as in the AL export.
    var o = sp.parts(sec);
    h += '<div class="col"><h2 id="' + sp.slug(sec.h) + '">' + e(sec.h) + '</h2>' + o.text + o.media + (sec.embed ? '' : o.buttons + o.extra) + '</div>';
    if (sec.embed) h += '<div class="wide">' + o.embed + o.buttons + '</div>' + (o.extra ? '<div class="col">' + o.extra + '</div>' : '');
  });
  h += '<div class="next">' +
    (sp.prev ? '<a href="' + sp.url(sp.prev.key) + '"><span class="mono">← ' + e(sp.prev.range) + '</span><b>' + e(sp.prev.name) + '</b></a>' : '<a href="' + sp.home + '"><span class="mono">← Back to</span><b>All sites</b></a>') +
    (sp.next ? '<a href="' + sp.url(sp.next.key) + '"><span class="mono">' + e(sp.next.range) + ' →</span><b>' + e(sp.next.name) + '</b></a>' : '<a href="' + sp.home + '"><span class="mono">Back to →</span><b>All sites</b></a>') + '</div>';
  return h;
}, function (s) {
  var vers = s.sections.filter(function (x) { return x.embed; }).map(function (x) { return x.embed; });
  document.querySelectorAll('.seg').forEach(function (b) {
    b.addEventListener('click', function () {
      var v = vers[+b.dataset.v];
      var w = document.querySelector('[data-embed="hero"]');
      w.querySelector('iframe').src = v.src;
      w.querySelector('.sp-url').textContent = v.addr;
      w.querySelector('.sp-vp').style.backgroundImage = 'url(' + v.img + ')';
      document.querySelector('.hero-open').href = v.src;
      document.querySelectorAll('.seg').forEach(function (x) { x.classList.toggle('on', x === b); });
    });
  });
});
</script>
</body>
</html>
