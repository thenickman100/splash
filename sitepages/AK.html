<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old Sites</title>
<link rel="stylesheet" href="../browser.css">
<link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;600;800&family=Fragment+Mono&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* AK · Chapters. Each section is a numbered chapter; the contents on the left follow your place.
   Paper and ink colors; the site's color marks the current chapter. */
:root{--surface:#f4f4f4;--bg:#f4f4f4;--ink:#141414;--muted:#5f5f5f;--line:#14141419;--accent:#16803a}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Rethink Sans',sans-serif}
a{color:inherit}
.mono{font-family:'Fragment Mono',monospace}
.top{display:flex;align-items:center;gap:20px;padding:18px 44px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.top .home{font-weight:800;text-decoration:none}.top .sp{flex-grow:1}.top .mono{font-size:12px;text-decoration:none}
.head{display:grid;grid-template-columns:1fr minmax(280px,360px);gap:40px;padding:70px 44px 50px;border-bottom:1px solid var(--line);align-items:end}
.head .kick{font-size:12px;color:var(--p-kicker)}
.head h1{margin:10px 0 18px;font-size:clamp(52px,8vw,112px);line-height:.9;letter-spacing:-0.045em;font-weight:800}
.head .lede{margin:0;max-width:640px;font:400 22px/1.5 'Source Serif 4',serif;color:#2a2a2a}
.sp-facts{margin:0;display:grid;gap:12px;font-size:14px;border-left:3px solid var(--p-mark);padding-left:20px}
.sp-facts div{display:grid;gap:2px}.sp-facts dt{font:11px 'Fragment Mono',monospace;color:var(--muted)}.sp-facts dd{margin:0;font-weight:600}
.sp-addr{display:block;white-space:nowrap}
.book{display:grid;grid-template-columns:260px 1fr;gap:56px;padding:0 44px}
.toc{position:sticky;top:64px;align-self:start;padding:40px 0;display:flex;flex-direction:column;gap:2px}
.toc a{display:grid;grid-template-columns:34px 1fr;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-size:15px}
.toc a .n{font:12px 'Fragment Mono',monospace;padding-top:2px}
.toc a.on{background:#1414140d;color:var(--ink);font-weight:600}.toc a.on .n{color:var(--p-tocNum)}
.ch{scroll-margin-top:70px;padding:56px 0 30px;border-bottom:1px solid var(--line);max-width:780px}
.ch .num{font:800 88px/.8 'Rethink Sans',sans-serif;letter-spacing:-0.05em;color:var(--p-num)}
.ch h2{margin:12px 0 22px;font-size:36px;font-weight:800;letter-spacing:-0.02em}
.ch h3{margin:26px 0 10px;font-size:19px}
.ch p{margin:0 0 18px;font:400 18.5px/1.72 'Source Serif 4',serif;color:#2a2a2a}
.sp-win{margin:22px 0 6px;overflow:hidden}
.sp-btns{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0 18px}
.sp-btn{height:40px;padding:0 16px;display:inline-flex;align-items:center;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);text-decoration:none;font:600 14px 'Rethink Sans',sans-serif;cursor:pointer}
.sp-btn.primary{background:var(--ink);color:var(--bg)}
.sp-fig{margin:22px 0}.sp-fig img{max-width:100%;display:block;border-radius:4px}
.sp-fig.dark img{background:var(--ink);padding:18px;box-sizing:border-box}
.sp-fig figcaption{margin-top:8px;font:12px 'Fragment Mono',monospace;color:var(--muted)}
.sp-gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin:12px 0 20px}
.sp-gallery .sp-fig{margin:0}.sp-gallery img{width:100%;aspect-ratio:4/3;object-fit:cover}
.sp-icons{grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}.sp-icons img{aspect-ratio:1;object-fit:contain}
.sp-list{columns:3 170px;padding:0;margin:0 0 10px;list-style:none;font:13.5px/1.9 'Fragment Mono',monospace}
.sp-list a{text-decoration:none;border-bottom:1px solid var(--line)}.sp-list span{color:var(--muted)}
.sp-code{white-space:pre-wrap;word-break:break-all;background:var(--ink);color:#ececec;padding:16px;border-radius:6px;font:12px/1.6 'Fragment Mono',monospace}
.sp-logos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:10px 0 18px}
.sp-logo{border:1.5px solid var(--line);background:#fff;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;align-items:center;font:10px 'Fragment Mono',monospace;color:var(--muted)}
.sp-logo img{width:100%;height:62px;object-fit:contain}.sp-logo.on{border-color:var(--p-mark)}
.end{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.end a{padding:36px 44px;text-decoration:none;display:flex;flex-direction:column;gap:6px}
.end a+a{border-left:1px solid var(--line);text-align:right}.end .mono{font-size:11px;color:var(--muted)}.end b{font-size:30px;font-weight:800;letter-spacing:-0.02em}
@media (max-width:900px){
  .top,.head,.book{padding-left:16px;padding-right:16px}.top .mono{display:none}
  .head{grid-template-columns:1fr;padding-top:56px}.head .lede{font-size:19px}
  .book{display:block}.toc{position:static;flex-direction:row;flex-wrap:wrap;padding:20px 0}
  .toc a{grid-template-columns:auto auto;gap:6px;border:1px solid var(--line)}
  .ch .num{font-size:60px}.ch p{font-size:17px}.end a{padding:24px 16px}.end b{font-size:21px}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="../palette.js"></script>
<script src="data.js"></script>
<script src="../browsernav.js"></script>
<script src="common.js"></script>
<script>
SP.boot(function (s, sp) {
  var e = sp.esc, h = '';
  h += '<div class="top"><a class="home" href="' + sp.home + '">← All sites</a><span class="sp"></span>' +
    (sp.prev ? '<a class="mono" href="' + sp.url(sp.prev.key) + '">← ' + e(sp.prev.name) + '</a>' : '') +
    (sp.next ? '<a class="mono" href="' + sp.url(sp.next.key) + '">' + e(sp.next.name) + ' →</a>' : '') + '</div>';
  h += '<header class="head"><div><div class="mono kick">' + e(s.range) + ' · ' + e(s.tier) + ' · ' + s.sections.length + ' chapters</div><h1>' + e(s.name) + '</h1>' +
    '<p class="lede">' + e(s.lede) + '</p></div>' + sp.factsHtml(s) + '</header>';
  h += '<div class="book"><nav class="toc">' + s.sections.map(function (x, k) {
    return '<a href="#' + sp.slug(x.h) + '"><span class="n">' + String(k + 1).padStart(2, '0') + '</span>' + e(x.h) + '</a>';
  }).join('') + '</nav><div>';
  s.sections.forEach(function (x, k) {
    h += '<section class="ch" id="' + sp.slug(x.h) + '"><div class="num">' + String(k + 1).padStart(2, '0') + '</div><h2>' + e(x.h) + '</h2>' + sp.body(x) + '</section>';
  });
  h += '</div></div><div class="end">' +
    (sp.prev ? '<a href="' + sp.url(sp.prev.key) + '"><span class="mono">← ' + e(sp.prev.range) + '</span><b>' + e(sp.prev.name) + '</b></a>' : '<a href="' + sp.home + '"><span class="mono">← Back to</span><b>All sites</b></a>') +
    (sp.next ? '<a href="' + sp.url(sp.next.key) + '"><span class="mono">' + e(sp.next.range) + ' →</span><b>' + e(sp.next.name) + '</b></a>' : '<a href="' + sp.home + '"><span class="mono">Back to</span><b>All sites</b></a>') + '</div>';
  return h;
}, function () {
  // Highlight the chapter being read.
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a'));
  var chs = links.map(function (a) { return document.getElementById(a.hash.slice(1)); });
  var mark = function () {
    var k = 0;
    chs.forEach(function (c, i) { if (c.getBoundingClientRect().top < innerHeight * 0.35) k = i; });
    links.forEach(function (a, i) { a.classList.toggle('on', i === k); });
  };
  addEventListener('scroll', mark, { passive: true });
  mark();
});
</script>
</body>
</html>
