<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site palettes</title>
<style>
:root{--bg:#f6f7f9;--fg:#15181d;--muted:#5b6270;--card:#fff;--line:#dde1e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111317;--fg:#eceef2;--muted:#9aa1ad;--card:#1b1e24;--line:#2c3038}}
:root[data-theme="dark"]{--bg:#111317;--fg:#eceef2;--muted:#9aa1ad;--card:#1b1e24;--line:#2c3038}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:36px 16px 60px}
h1{margin:0 0 6px;font-size:30px}
.intro{margin:0 0 28px;color:var(--muted);max-width:680px}
a{color:inherit}
.site{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;display:grid;grid-template-columns:260px 1fr;gap:20px}
.site h2{margin:0 0 4px;font-size:21px}
.shot{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line);display:block}
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 14px}
.chip{border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.chip .sw{height:78px;display:flex;align-items:flex-start;justify-content:space-between;padding:8px 10px;font:700 13px ui-monospace,monospace}
.chip .meta{padding:8px 10px;font-size:12.5px;line-height:1.4}
.chip code{font:600 13px ui-monospace,monospace}
.chip .from{color:var(--muted)}
.prev{border-radius:10px;overflow:hidden;display:grid;grid-template-columns:1.2fr 1fr;min-height:120px}
.prev .a{padding:16px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px}
.prev .a .yr{font:800 30px/0.95 system-ui,sans-serif;letter-spacing:-0.03em}
.prev .a b{font-size:18px}
.prev .b{padding:16px;display:flex;flex-direction:column;gap:8px;justify-content:center}
.prev .btn{align-self:flex-start;padding:8px 14px;border-radius:8px;font:700 13px system-ui,sans-serif}
.prev .tag{font:12px ui-monospace,monospace}
.note{margin:10px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:700px){.site{grid-template-columns:1fr}.chip .sw{height:60px}}
</style>
</head>
<body>
<main>
<h1>Site palettes</h1>
<p class="intro">The top 3 colors for each site, in order, sampled from its own pages. Color 1 is the site's main color. The strip under each set shows the 3 together. Tell me any color to swap or reorder, and I'll fix contrast after you pick. <a href="index.html">← Back to the candidates</a></p>
<div id="list"></div>
</main>
<script>
// [hex, where it was sampled]. Order is the proposed rank.
var P = [
  { name: 'Awesome Stuff', shot: 'sitepages/img/awesome-lawesomel.jpg', c: [
    ['#acf084', 'Lime of the box headings on lawesomel.webs.com'],
    ['#30341c', 'Dark olive page background'],
    ['#e4ecec', 'Pale gray of the boxes'] ] },
  { name: 'Askthenickman', shot: 'sitepages/img/ask-home.jpg', c: [
    ['#d60202', 'Red of the logo'],
    ['#05030e', 'Black page background'],
    ['#f6c600', 'Yellow of the starburst behind the logo'] ] },
  { name: 'Titans Softball', shot: 'sitepages/img/titans.jpg', c: [
    ['#fcc308', 'Gold page background'],
    ['#30243c', 'Purple tab bar and stat boxes'],
    ['#ffffff', 'White'] ] },
  { name: 'Hack a HOBO', shot: 'sitepages/img/hobo-2026.jpg', c: [
    ['#28a0c0', 'Blue behind the logo'],
    ['#ffffff', 'White'],
    ['#30a82a', 'Green outline of the logo, 2026 Edition with the original theme'] ] },
  { name: 'BV Homework', shot: 'sitepages/img/bv.jpg', c: [
    ['#d9232a', 'Red of the logo'],
    ['#81cafc', 'Sky blue page background'],
    ['#949000', 'Green of the subject buttons in the nav panel'] ] },
  { name: 'EnGen NextGen', shot: 'sitepages/img/engen.jpg', c: [
    ['#b8505e', 'Red of the text under the logo and the text across the site (thin text, so the shade is approximate)'],
    ['#0055e6', 'Blue of the logo'],
    ['#fcfcfc', 'White graph-paper background'] ] },
  { name: 'Home', shot: 'sitepages/img/home.jpg', c: [
    ['#46e7ff', 'Cyan of the bars'],
    ['#a9ffff', 'Light cyan of the boxes'],
    ['#fcfcfc', 'White patterned background'] ] },
  { name: 'Space Atlas', shot: 'candidates/v0.1/exhibits/spaceatlas/mars.jpg', c: [
    ['#2c2c2c', 'Gray menu bar'],
    ['#000000', 'Black background'],
    ['#e08424', 'Orange underline under MARS in the menu'] ] }
];
function lum(h) { var n = parseInt(h.slice(1), 16), c = [n >> 16 & 255, n >> 8 & 255, n & 255].map(function (v) { v /= 255; return v <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4); }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; }
function on(h) { return lum(h) > .2 ? '#111' : '#fff'; }
document.getElementById('list').innerHTML = P.map(function (s) {
  var c = s.c.map(function (x) { return x[0]; });
  return '<section class="site"><div><h2>' + s.name + '</h2><img class="shot" src="' + s.shot + '" alt="' + s.name + '"></div><div>' +
    '<div class="chips">' + s.c.map(function (x, i) {
      return '<div class="chip"><div class="sw" style="background:' + x[0] + ';color:' + on(x[0]) + '"><span>' + (i + 1) + '</span></div>' +
        '<div class="meta"><code>' + x[0] + '</code><div class="from">' + x[1] + '</div></div></div>';
    }).join('') + '</div>' +
    '<div class="prev"><div class="a" style="background:' + c[0] + ';color:' + on(c[0]) + '"><span class="tag">Color 1</span><span class="yr">' + s.name + '</span></div>' +
    '<div class="b" style="background:' + c[1] + ';color:' + on(c[1]) + '"><span class="tag">Color 2, with a color 3 button</span><span class="btn" style="background:' + c[2] + ';color:' + on(c[2]) + '">Read more →</span></div></div>' +
    '</div></section>';
}).join('');
</script>
</body>
</html>
